<script>
document.getElementById("voterForm").addEventListener("submit", function(event) {
    event.preventDefault();

    const name = document.getElementById("name").value.trim();
    const email = document.getElementById("email").value.trim();
    const age = Number(document.getElementById("age").value);
    const voterid = document.getElementById("voterid").value.trim();
    const password = document.getElementById("password").value;
    const message = document.getElementById("message");

    if (age < 18) {
        message.textContent = "Registration requires an age of 18 or above.";
        message.style.display = "block";
        return;
    }

    if (!/^[0-9]{5}$/.test(voterid) ||
        !/^[0-9]{5}$/.test(password)) {
        message.textContent = "Voter ID and password must each contain exactly 5 digits.";
        message.style.display = "block";
        return;
    }

    if (localStorage.getItem("demoVoter_" + voterid)) {
        message.textContent = "This Voter ID is already registered. Please use another ID.";
        message.style.display = "block";
        return;
    }

    const voter = {
        name: name,
        email: email,
        age: age,
        voterid: voterid,
        password: password
    };

    localStorage.setItem("demoVoter_" + voterid, JSON.stringify(voter));
    localStorage.setItem("demoRegisteredVoterID", voterid);

    message.innerHTML =
        "<strong>Registration successful!</strong><br>" +
        "Your Voter ID is " + voterid +
        ". Please log in to continue." +
        '<br><br><a href="voter-login.html">Go to Voter Login</a>';

    message.style.display = "block";
});
</script>
