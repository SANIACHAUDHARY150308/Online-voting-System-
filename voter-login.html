
<script>
document.getElementById("loginForm").addEventListener("submit", function(event) {
    event.preventDefault();

    const voterId = document.getElementById("voterId").value.trim();
    const password = document.getElementById("password").value;
    const message = document.getElementById("message");

    const savedVoter = localStorage.getItem("demoVoter_" + voterId);

    if (!savedVoter) {
        message.textContent = "Voter ID not found. Please register first.";
        message.style.display = "block";
        message.style.background = "#ffe5e5";
        message.style.color = "#a12626";
        return;
    }

    const voter = JSON.parse(savedVoter);

    if (voter.password !== password) {
        message.textContent = "Incorrect password. Please try again.";
        message.style.display = "block";
        message.style.background = "#ffe5e5";
        message.style.color = "#a12626";
        return;
    }

    localStorage.setItem("demoLoggedInVoterID", voterId);

    message.textContent = "Login successful! Opening your voter dashboard...";
    message.style.display = "block";
    message.style.background = "#e1f8ed";
    message.style.color = "#176b50";

    setTimeout(function() {
        window.location.href = "voter-dashboard.html";
    }, 1200);
});
</script>
