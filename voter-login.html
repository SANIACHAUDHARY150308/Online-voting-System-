
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Voter Login | Civic Bloom</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:Arial,sans-serif;background:linear-gradient(135deg,#e2e5ff,#d9f8ef,#ffe5f0);color:#39335d;display:flex;align-items:center;justify-content:center;padding:20px}
.wrap{width:100%;max-width:900px;display:grid;grid-template-columns:1fr 1fr;gap:24px;align-items:center}
.art,.login{border-radius:26px;padding:30px;background:#ffffffc9;box-shadow:0 12px 35px #5145cd18}
.art{text-align:center}
.illustration{font-size:90px;background:linear-gradient(135deg,#dcd5ff,#d8f7ed);border-radius:24px;padding:25px;margin:18px 0}
h1{color:#6253c7;margin-bottom:10px}
p{line-height:1.7;color:#77718e}
label{display:block;margin:16px 0 7px;font-weight:bold;font-size:14px}
input{width:100%;padding:14px;border:1px solid #ded8f5;border-radius:12px;background:#fff;font-size:15px}
button,.link{display:block;width:100%;padding:14px;border:0;border-radius:12px;background:linear-gradient(90deg,#7966e8,#40bba8);color:white;font-weight:bold;font-size:15px;text-align:center;text-decoration:none;margin-top:18px;cursor:pointer}
.links{text-align:center;margin-top:18px;font-size:14px}
.links a{color:#6654c9;text-decoration:none;font-weight:bold}
.message{display:none;background:#e1f8ed;padding:12px;border-radius:12px;margin-top:15px;color:#176b50;line-height:1.5}
@media(max-width:650px){.wrap{grid-template-columns:1fr}.art{padding:20px}.illustration{font-size:65px;padding:15px}.login{padding:24px}}
</style>
</head>
<body>
<main class="wrap">
<section class="art">
<div style="font-size:40px">🌿</div>
<h1>Your Vote Matters!</h1>
<div class="illustration">🗳️✨</div>
<h2>Every voice counts.</h2>
<p>Sign in to explore candidates, cast your demo vote, and check your voting status.</p>
</section>

<section class="login">
<div style="font-size:34px">🔐</div>
<h1>Voter Login</h1>
<p>Enter your demo voter details to continue.</p>
<form id="loginForm">
<label for="voterId">5-Digit Voter ID</label>
<input id="voterId" type="text" inputmode="numeric" pattern="[0-9]{5}" maxlength="5" placeholder="e.g. 12345" required>
<label for="password">5-Digit Password</label>
<input id="password" type="password" inputmode="numeric" pattern="[0-9]{5}" maxlength="5" placeholder="Enter 5 digits" required>
<button type="submit">Login to Dashboard →</button>
</form>
<div id="message" class="message">Demo login successful! Opening your voter dashboard...</div>
<a class="link" href="voter.html" style="background:#e9e5ff;color:#5145b5">← Voter Registration</a>
<div class="links">Return to <a href="role.html">Select Role</a></div>
</section>
</main>
<script>
document.getElementById("loginForm").addEventListener("submit",function(event){
event.preventDefault();
document.getElementById("message").style.display="block";
setTimeout(function(){window.location.href="voter-dashboard.html"},1200);
});
</script>
</body>
</html>
